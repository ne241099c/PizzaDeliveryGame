<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイトル画面 モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=block" rel="stylesheet">
<style>
/* UITheme v2 のトークン（設計書_画面デザイン 2-1） */
:root{
  --paper:#FFF6E5; --paper-deep:#F3E3C3; --ink:#3A2A20; --ink-sub:#7A6652;
  --tomato:#E04B2D; --tomato-dark:#A8361F; --basil:#4C9A52; --cheese:#F7BE3D;
  --berry:#B3261E; --blue:#3C79C2; --disabled:#C9BBA3;
  --wood:#C98B5B; --plaster:#F1E4CF; --tree:#6FA45F;
  --edge:3px; --shadow:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#2b211a;overflow:hidden}
/* 1920×1080 の固定ステージを画面に合わせて縮小 */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  font-family:"Zen Maru Gothic",sans-serif;color:var(--ink)}
#scene,#logo{position:absolute;inset:0}

/* 左の列 */
.badge{position:absolute;left:128px;top:72px;padding:8px 22px;border:var(--edge) solid var(--ink);border-radius:999px;
  background:var(--cheese);font-weight:900;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.tagline{position:absolute;left:132px;top:470px;font-weight:900;font-size:24px;line-height:1.6;
  text-shadow:0 2px 0 rgba(255,246,229,.9)}
.menu{position:absolute;left:128px;top:582px;width:520px;display:flex;flex-direction:column;gap:18px}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:var(--edge) solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);
  box-shadow:0 var(--shadow) 0 var(--ink);cursor:pointer;user-select:none;
  transition:transform .08s ease-out, box-shadow .08s ease-out}
.btn:hover{transform:translateY(-2px);box-shadow:0 calc(var(--shadow) + 2px) 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.primary{height:108px;background:var(--tomato);color:#fff;box-shadow:0 var(--shadow) 0 var(--tomato-dark),0 var(--shadow) 0 var(--edge) var(--ink)}
.btn.primary:hover{box-shadow:0 8px 0 var(--tomato-dark),0 8px 0 var(--edge) var(--ink)}
.btn.primary .label{font-family:"Mochiy Pop One",sans-serif;font-size:42px;letter-spacing:.06em;line-height:1.1}
.btn.primary .sub{margin-top:6px;font-size:18px;font-weight:700;opacity:.95;display:flex;gap:14px;align-items:center}
.btn.primary .sub b{font-weight:900}
.btn.secondary{height:76px}
.btn.secondary .label{font-family:"Mochiy Pop One",sans-serif;font-size:30px;letter-spacing:.06em}
.row{display:flex;gap:16px}
.row .btn{flex:1;height:64px}
.row .btn .label{font-weight:900;font-size:24px;letter-spacing:.04em}
.footer{position:absolute;left:128px;bottom:28px;padding:6px 16px;border-radius:999px;background:rgba(255,246,229,.92);
  border:2px solid var(--ink);font-size:16px;font-weight:700;color:var(--ink-sub)}
.footer a{color:var(--ink-sub);text-decoration:underline;text-underline-offset:3px}

/* 動き（設計書 2-5。短く、操作を邪魔しない） */
@keyframes drive{from{transform:translateX(-360px)}to{transform:translateX(2280px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.8)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
.scooter{animation:drive 14s linear infinite}
.scooter .body{animation:bob .5s ease-in-out infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.cloud{animation:drift 18s ease-in-out infinite alternate}
.cloud.slow{animation-duration:26s}
.steam{transform-box:fill-box;transform-origin:center bottom;animation:steam 2.4s ease-out infinite}
.steam.d2{animation-delay:.8s}.steam.d3{animation-delay:1.6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">

<!-- 背景：街（右側に集める。左の列とは重ねない） -->
<svg id="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD6EE"/>
      <stop offset=".55" stop-color="#D4EEF1"/>
      <stop offset=".82" stop-color="#FFF1D6"/>
    </linearGradient>
    <radialGradient id="oven" cx=".5" cy=".7" r=".7">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset=".55" stop-color="#F08A3C"/>
      <stop offset="1" stop-color="#B8462A"/>
    </radialGradient>
    <pattern id="awning" width="80" height="90" patternUnits="userSpaceOnUse" x="886">
      <rect width="40" height="90" fill="#E04B2D"/><rect x="40" width="40" height="90" fill="#FFF6E5"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 太陽 -->
  <circle cx="1700" cy="180" r="138" fill="#FFF3CC" opacity=".55"/>
  <circle cx="1700" cy="180" r="96" fill="#FFE39A" stroke="#3A2A20" stroke-width="3"/>

  <!-- 雲（ロゴの右側だけ） -->
  <g class="cloud" stroke="#3A2A20" stroke-width="3" fill="#FFFFFF">
    <path d="M940 210 q0-46 52-46 q16-40 66-34 q34-26 74 4 q52-6 56 40 q38 6 36 36 z"/>
  </g>
  <g class="cloud slow" stroke="#3A2A20" stroke-width="3" fill="#FFFFFF">
    <path transform="translate(120 44)" d="M1380 352 q0-34 40-34 q14-30 52-24 q28-18 56 6 q40 0 40 52 z"/>
  </g>

  <!-- 遠くの街並み（縁なし・薄い面で奥行き） -->
  <g fill="#E9DCC4" opacity=".9">
    <path d="M748 880 v-230 l66-52 66 52 v230 z"/>
    <rect x="1490" y="560" width="110" height="320" rx="6"/>
    <rect x="1840" y="600" width="120" height="280" rx="6"/>
    <path d="M1610 880 v-210 l70-56 70 56 v210 z"/>
  </g>

  <!-- 右隣の家（青い屋根） -->
  <g stroke="#3A2A20" stroke-width="3">
    <path d="M1520 560 l120-92 120 92 z" fill="#6C9BD2"/>
    <rect x="1540" y="560" width="200" height="320" fill="#F1E4CF"/>
    <rect x="1572" y="604" width="52" height="60" rx="6" fill="#CFE6F3"/>
    <rect x="1656" y="604" width="52" height="60" rx="6" fill="#CFE6F3"/>
    <rect x="1572" y="704" width="52" height="60" rx="6" fill="#CFE6F3"/>
    <rect x="1656" y="704" width="52" height="60" rx="6" fill="#CFE6F3"/>
    <rect x="1612" y="800" width="56" height="80" rx="6" fill="#C98B5B"/>
  </g>
  <!-- さらに右の家（黄色い屋根、画面の外へ続く） -->
  <g stroke="#3A2A20" stroke-width="3">
    <path d="M1772 620 l110-80 110 80 z" fill="#E7B94C"/>
    <rect x="1790" y="620" width="180" height="260" fill="#FFF6E5"/>
    <rect x="1820" y="664" width="48" height="56" rx="6" fill="#CFE6F3"/>
    <rect x="1820" y="752" width="48" height="56" rx="6" fill="#CFE6F3"/>
  </g>

  <!-- 木（店の左） -->
  <g stroke="#3A2A20" stroke-width="3">
    <rect x="806" y="770" width="20" height="112" rx="6" fill="#C98B5B"/>
    <circle cx="816" cy="738" r="62" fill="#6FA45F"/>
    <circle cx="796" cy="724" r="16" fill="#8DBE78" stroke="none"/>
  </g>

  <!-- ピザ屋（主役） -->
  <g stroke="#3A2A20" stroke-width="3">
    <!-- 煙突と湯気 -->
    <rect x="1396" y="376" width="44" height="66" fill="#C98B5B"/><rect x="1390" y="368" width="56" height="16" rx="4" fill="#5A4636"/>
    <g fill="#FFFFFF" stroke="#3A2A20" stroke-width="2.5">
      <circle class="steam" cx="1418" cy="350" r="14"/>
      <circle class="steam d2" cx="1426" cy="350" r="12"/>
      <circle class="steam d3" cx="1410" cy="350" r="10"/>
    </g>
    <!-- 本体 -->
    <rect x="900" y="470" width="560" height="410" fill="#FFF6E5"/>
    <rect x="880" y="440" width="600" height="44" rx="10" fill="#E04B2D"/>
    <!-- 看板 -->
    <rect x="1000" y="318" width="360" height="104" rx="22" fill="#FFF6E5"/>
    <line x1="1060" y1="422" x2="1060" y2="440"/><line x1="1300" y1="422" x2="1300" y2="440"/>
    <text x="1180" y="396" text-anchor="middle" font-family="Mochiy Pop One" font-size="70" fill="#E04B2D" stroke="none" letter-spacing="4">PIZZA</text>
    <!-- 日よけ（縞＋波の縁） -->
    <path d="M886 506 h588 l-24 84 h-540 z" fill="url(#awning)"/>
    <path d="M910 590 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 q22 26 45 0 z" fill="#E04B2D"/>
    <!-- 窓（中に窯の火） -->
    <rect x="936" y="640" width="276" height="200" rx="14" fill="#CFE6F3"/>
    <path d="M988 820 v-74 a86 72 0 0 1 172 0 v74 z" fill="#5A4636"/>
    <path d="M1010 820 v-62 a64 54 0 0 1 128 0 v62 z" fill="url(#oven)" stroke="none"/>
    <line x1="936" y1="740" x2="988" y2="740"/><line x1="1160" y1="740" x2="1212" y2="740"/>
    <!-- 花のプランター -->
    <rect x="930" y="840" width="288" height="30" rx="8" fill="#C98B5B"/>
    <g stroke-width="2.5"><circle cx="962" cy="836" r="11" fill="#E04B2D"/><circle cx="1000" cy="832" r="11" fill="#F7BE3D"/><circle cx="1150" cy="832" r="11" fill="#F7BE3D"/><circle cx="1188" cy="836" r="11" fill="#E04B2D"/></g>
    <!-- 扉 -->
    <rect x="1252" y="640" width="160" height="240" rx="12" fill="#C98B5B"/>
    <rect x="1276" y="664" width="112" height="84" rx="10" fill="#CFE6F3"/>
    <circle cx="1388" cy="784" r="8" fill="#F7BE3D"/>
    <!-- OPEN の札 -->
    <line x1="1300" y1="756" x2="1332" y2="740" stroke-width="2.5"/><line x1="1364" y1="756" x2="1332" y2="740" stroke-width="2.5"/>
    <rect x="1290" y="754" width="84" height="34" rx="8" fill="#4C9A52"/>
    <text x="1332" y="779" text-anchor="middle" font-family="Zen Maru Gothic" font-weight="900" font-size="20" fill="#FFFFFF" stroke="none">OPEN</text>
    <!-- 立て看板 -->
    <path d="M1470 880 l18-118 h68 l18 118" fill="none"/>
    <rect x="1478" y="770" width="88" height="80" rx="8" fill="#5A4636"/>
    <text x="1522" y="806" text-anchor="middle" font-family="Zen Maru Gothic" font-weight="900" font-size="18" fill="#FFF6E5" stroke="none">本日の</text>
    <text x="1522" y="834" text-anchor="middle" font-family="Zen Maru Gothic" font-weight="900" font-size="18" fill="#F7BE3D" stroke="none">ピザ</text>
  </g>

  <!-- 歩道と道路 -->
  <rect x="0" y="880" width="1920" height="40" fill="#EAD9BC" stroke="#3A2A20" stroke-width="3"/>
  <rect x="0" y="920" width="1920" height="160" fill="#8A7867"/>
  <line x1="0" y1="921.5" x2="1920" y2="921.5" stroke="#3A2A20" stroke-width="3"/>
  <line x1="0" y1="1004" x2="1920" y2="1004" stroke="#FFF6E5" stroke-width="8" stroke-dasharray="64 56"/>

  <!-- 配達のスクーター（ゆっくり走る） -->
  <g class="scooter">
    <g transform="translate(0 860)" stroke="#3A2A20" stroke-width="3">
      <g opacity=".5" stroke-width="4"><line x1="-64" y1="70" x2="-24" y2="70"/><line x1="-88" y1="90" x2="-36" y2="90"/><line x1="-60" y1="110" x2="-28" y2="110"/></g>
      <g class="body">
        <!-- 荷台の箱 -->
        <rect x="-4" y="40" width="78" height="62" rx="8" fill="#F7BE3D"/>
        <text x="35" y="78" text-anchor="middle" font-family="Mochiy Pop One" font-size="16" fill="#3A2A20" stroke="none">PIZZA</text>
        <!-- 車体 -->
        <path d="M10 112 h96 l28-44 h34 l10 50 q-14 14 -40 14 h-128 z" fill="#E04B2D"/>
        <path d="M150 68 l-6-30 h22" fill="none" stroke-width="4"/>
        <rect x="40" y="96" width="64" height="16" rx="8" fill="#5A4636"/>
        <!-- 配達員（色の丸＋頭文字。名簿と同じ色） -->
        <rect x="84" y="50" width="38" height="56" rx="16" fill="#3C79C2" transform="rotate(12 103 78)"/>
        <path d="M118 66 l28-24" stroke-width="12" stroke="#3A2A20"/>
        <path d="M118 66 l28-24" stroke-width="6" stroke="#3C79C2"/>
        <circle cx="112" cy="34" r="26" fill="#3C79C2"/>
        <text x="112" y="44" text-anchor="middle" font-family="Mochiy Pop One" font-size="26" fill="#FFFFFF" stroke="none">A</text>
      </g>
      <g class="wheel"><circle cx="30" cy="134" r="22" fill="#3A2A20"/><circle cx="30" cy="134" r="8" fill="#C9BBA3" stroke="none"/><line x1="30" y1="116" x2="30" y2="124" stroke="#C9BBA3"/></g>
      <g class="wheel"><circle cx="164" cy="134" r="22" fill="#3A2A20"/><circle cx="164" cy="134" r="8" fill="#C9BBA3" stroke="none"/><line x1="164" y1="116" x2="164" y2="124" stroke="#C9BBA3"/></g>
    </g>
  </g>
</svg>

<!-- ロゴ（ステッカー風：紙色の外縁＋濃い縁＋ずらし影） -->
<svg id="logo" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none">
  <g font-family="Mochiy Pop One" stroke-linejoin="round" paint-order="stroke">
    <g fill="#3A2A20" stroke="#3A2A20" stroke-width="30" transform="translate(0 8)">
      <text x="120" y="300" font-size="140">ピザ</text>
      <text x="120" y="428" font-size="118">配達ゲーム</text>
    </g>
    <g fill="#FFF6E5" stroke="#FFF6E5" stroke-width="30">
      <text x="120" y="300" font-size="140">ピザ</text>
      <text x="120" y="428" font-size="118">配達ゲーム</text>
    </g>
    <g fill="#E04B2D" stroke="#3A2A20" stroke-width="12">
      <text x="120" y="300" font-size="140">ピザ</text>
      <text x="120" y="428" font-size="118">配達ゲーム</text>
    </g>
  </g>
  <!-- ひと切れのピザ（「ピザ」の右） -->
  <g transform="translate(452 178) rotate(14)" stroke="#3A2A20" stroke-width="4" stroke-linejoin="round">
    <path d="M0 0 q60-26 120 0 l-60 128 z" fill="#FFF6E5" stroke-width="12" stroke="#FFF6E5" transform="translate(0 6)"/>
    <path d="M0 0 q60-26 120 0 l-60 128 z" fill="#F7BE3D"/>
    <path d="M-4 -2 q64-30 128 0 l-6 12 q-58-24 -116 0 z" fill="#C98B5B"/>
    <circle cx="44" cy="34" r="12" fill="#E04B2D"/><circle cx="80" cy="44" r="10" fill="#E04B2D"/><circle cx="60" cy="78" r="9" fill="#E04B2D"/>
  </g>
</svg>

<div class="badge">小さな街のピザ屋さん</div>
<p class="tagline">作って、渡して、ルートを決める。<br>店長として、街のピザを届けよう。</p>

<div class="menu">
  <div class="btn primary" role="button">
    <span class="label">続きから</span>
    <span class="sub"><b>3日目</b><span>¥1,240</span><span>★ 72</span></span>
  </div>
  <div class="btn secondary" role="button"><span class="label">最初から</span></div>
  <div class="row">
    <div class="btn" role="button"><span class="label">遊び方</span></div>
    <div class="btn" role="button"><span class="label">終了</span></div>
  </div>
</div>

<div class="footer">v0.1.0 ・ <a>クレジット</a></div>
</div>

<script>
// 1920×1080 のステージを、ウィンドウに収まるよう等倍縮小して中央に置く
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=document.getElementById('stage');
  st.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
// #still：静止画の書き出し用。スクーターを店の前で止める
if(location.hash==='#still'){const s=document.querySelector('.scooter');s.style.animation='none';s.style.transform='translateX(1010px)';}
</script>
</body>
</html>
